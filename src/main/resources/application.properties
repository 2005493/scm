spring.application.name=scm
server.port=8081
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scm
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate/JPA Specific Properties (Optional but good to have)
# For Spring Boot 3.x and Hibernate 6.x, 'MySQLDialect' is usually sufficient.
# Hibernate can often auto-detect, but explicitly setting it can prevent issues.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# To show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# To automatically create/update database schema (for development, be careful in production)
# Possible values: none, update, create, create-drop, validate
spring.jpa.hibernate.ddl-auto=update