<!DOCTYPE html>
<html lang="en" th:fragment="parent(content,title)" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Meta tags for responsiveness and encoding -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title will be replaced by the child template's title -->
    <title th:replace="${title}">Document</title>
    <!-- Main CSS file (Tailwind or custom styles) -->
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
    <!-- Flowbite CSS for UI components -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body>
  <!-- This line includes the 'navbar' fragment from 'fragments/navbar.html' at this position -->
   <div th:replace="fragments/navbar :: navbar"></div>
   <!-- Content placeholder: replaced by child template's content -->
   <div id="content" th:replace="${content}"></div>
   <!-- Footer section -->
   <footer style="text-align:center; padding:1rem; background:#f3f4f6;">
        &copy; 2025 SCM Application. All rights reserved.
   </footer>
</body>
</html>
